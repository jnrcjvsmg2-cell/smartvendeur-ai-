<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartVendeur AI — Vendez plus avec WhatsApp</title>
  <meta name="description" content="SmartVendeur AI aide les vendeurs à attirer des clients et vendre plus facilement sur WhatsApp.">

<style>
    :root {
      --primary: #25d366;
      --dark: #07111f;
      --dark2: #0d1b2f;
      --white: #ffffff;
      --text: #dbe7f5;
      --muted: #9db0c7;
      --orange: #ffb703;
    }

* {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--dark);
      color: var(--white);
      line-height: 1.6;
    }

header {
      padding: 22px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

.logo {
      font-size: 22px;
      font-weight: bold;
    }

.logo span {
      color: var(--primary);
    }

nav a {
      color: var(--text);
      text-decoration: none;
      margin-left: 22px;
      font-size: 14px;
    }

.hero {
      min-height: 650px;
      padding: 90px 7%;
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 50px;
      align-items: center;
      background:
        radial-gradient(circle at 80% 20%, rgba(37,211,102,.18), transparent 35%),
        linear-gradient(135deg, #07111f, #10243c);
    }

.badge {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 30px;
      color: var(--primary);
      border: 1px solid rgba(37,211,102,.4);
      background: rgba(37,211,102,.08);
      font-size: 13px;
      margin-bottom: 20px;
    }

h1 {
      font-size: clamp(38px, 6vw, 68px);
      line-height: 1.05;
      margin-bottom: 24px;
    }

h1 span {
      color: var(--primary);
    }

.hero p {
      max-width: 570px;
      color: var(--text);
      font-size: 18px;
      margin-bottom: 30px;
    }

.buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

.btn {
      display: inline-block;
      padding: 15px 23px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      transition: .2s;
    }

.btn:hover {
      transform: translateY(-3px);
    }

.btn-primary {
      color: #06200f;
      background: var(--primary);
    }

.btn-secondary {
      color: var(--white);
      border: 1px solid rgba(255,255,255,.25);
    }

.phone {
      max-width: 330px;
      margin: auto;
      padding: 18px;
      border-radius: 30px;
      background: #101c2c;
      border: 7px solid #26384e;
      box-shadow: 0 25px 70px rgba(0,0,0,.4);
    }

.phone-top {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 18px;
    }

.chat {
      background: #d9fdd3;
      color: #17251a;
      min-height: 380px;
      padding: 18px 12px;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 12px;
    }

.message {
      max-width: 85%;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 13px;
    }

.received {
      background: white;
      align-self: flex-start;
    }

.sent {
      background: #baf3ad;
      align-self: flex-end;
    }

section {
      padding: 80px 7%;
    }

.section-title {
      text-align: center;
      max-width: 700px;
      margin: auto auto 45px;
    }

.section-title h2 {
      font-size: 36px;
      margin-bottom: 12px;
    }

.section-title p {
      color: var(--muted);
    }

.cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
      max-width: 1100px;
      margin: auto;
    }

.card {
      padding: 28px;
      background: var(--dark2);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px;
    }

.icon {
      font-size: 34px;
      margin-bottom: 16px;
    }

.card h3 {
      margin-bottom: 10px;
    }

.card p {
      color: var(--muted);
      font-size: 15px;
    }

.offer {
      background: #0b1728;
    }

.pricing {
      max-width: 500px;
      margin: auto;
      padding: 35px;
      text-align: center;
      background: linear-gradient(145deg, #12304a, #0c1a2c);
      border: 1px solid rgba(37,211,102,.4);
      border-radius: 18px;
    }

.pricing h3 {
      font-size: 25px;
      margin-bottom: 12px;
    }

.price {
      color: var(--orange);
      font-size: 38px;
      font-weight: bold;
      margin: 15px 0;
    }

.pricing ul {
      list-style: none;
      text-align: left;
      margin: 25px 0;
      color: var(--text);
    }

.pricing li {
      margin: 11px 0;
    }

.pricing li::before {
      content: "✓";
      color: var(--primary);
      font-weight: bold;
      margin-right: 10px;
    }

.cta {
      text-align: center;
      background: linear-gradient(135deg, #0e4429, #07111f);
    }

.cta h2 {
      font-size: 38px;
      margin-bottom: 15px;
    }

.cta p {
      color: var(--text);
      margin-bottom: 28px;
    }

footer {
      padding: 25px 7%;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      border-top: 1px solid rgba(255,255,255,.08);
    }

@media (max-width: 800px) {
      nav {
        display: none;
      }

.hero {
        grid-template-columns: 1fr;
        padding-top: 60px;
      }

.cards {
        grid-template-columns: 1fr;
      }

.hero p {
        font-size: 16px;
      }

section {
        padding: 60px 6%;
      }
    }
  </style>
</head>

<body>

<header>
    <div class="logo">Smart<span>Vendeur</span> AI</div>

<nav>
      <a href="#fonctionnalites">Fonctionnalités</a>
      <a href="#offre">Offre</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

<main>

<section class="hero">
      <div>
        <div class="badge">La solution simple pour vendre sur WhatsApp</div>

<h1>Transformez vos messages en <span>ventes.</span></h1>

<p>
          SmartVendeur AI aide les petits commerçants, entrepreneurs et vendeurs
          en ligne à attirer plus de clients et à vendre plus facilement grâce à WhatsApp.
        </p>

<div class="buttons">
          <a
            class="btn btn-primary"
            href="https://wa.me/22788032328?text=Bonjour%20je%20veux%20en%20savoir%20plus%20sur%20SmartVendeur%20AI"
            target="_blank">
            💬 Commencer sur WhatsApp
          </a>

<a class="btn btn-secondary" href="#fonctionnalites">
            Découvrir la solution
          </a>
        </div>
      </div>

<div class="phone">
        <div class="phone-top">SmartVendeur AI</div>

<div class="chat">
          <div class="message received">
            Bonjour, votre produit est-il encore disponible ?
          </div>

<div class="message sent">
            Bonjour ! Oui, il est disponible. Voulez-vous passer commande ?
          </div>

<div class="message received">
            Oui, je prends deux pièces.
          </div>

<div class="message sent">
            Parfait ! Je vous envoie les détails de livraison.
          </div>
        </div>
      </div>
    </section>

<section id="fonctionnalites">
      <div class="section-title">
        <h2>Tout pour vendre plus facilement</h2>
        <p>
          Une solution pensée pour les vendeurs africains qui utilisent WhatsApp
          pour développer leur activité.
        </p>
      </div>

<div class="cards">
        <div class="card">
          <div class="icon">🤖</div>
          <h3>Réponses intelligentes</h3>
          <p>
            Répondez rapidement aux questions de vos clients et ne ratez plus
            aucune opportunité de vente.
          </p>
        </div>

<div class="card">
          <div class="icon">📱</div>
          <h3>Vente sur WhatsApp</h3>
          <p>
            Présentez vos produits, échangez avec vos clients et recevez vos
            commandes directement sur WhatsApp.
          </p>
        </div>

<div class="card">
          <div class="icon">📈</div>
          <h3>Plus de clients</h3>
          <p>
            Améliorez vos messages publicitaires et attirez davantage de clients
            grâce à des textes plus convaincants.
          </p>
        </div>
      </div>
    </section>

<section id="offre" class="offer">
      <div class="section-title">
        <h2>Commencez simplement</h2>
        <p>
          Testez SmartVendeur AI et découvrez comment améliorer vos ventes.
        </p>
      </div>

<div class="pricing">
        <h3>Pack lancement</h3>

<div class="price">Sur demande</div>

<ul>
          <li>Conseils pour améliorer vos ventes</li>
          <li>Messages WhatsApp professionnels</li>
          <li>Présentation de vos produits</li>
          <li>Accompagnement personnalisé</li>
        </ul>

<a
          class="btn btn-primary"
          href="https://wa.me/22788032328?text=Bonjour%2C%20je%20souhaite%20commander%20le%20Pack%20lancement"
          target="_blank">
          Demander le pack
        </a>
      </div>
    </section>

<section id="contact" class="cta">
      <h2>Prêt à vendre davantage ?</h2>

<p>
        Contactez-nous maintenant sur WhatsApp et présentez-nous votre activité.
      </p>

<a
        class="btn btn-primary"
        href="https://wa.me/22788032328?text=Bonjour%2C%20je%20veux%20lancer%20mon%20activité%20avec%20SmartVendeur%20AI"
        target="_blank">
        🚀 Contacter SmartVendeur AI
      </a>
    </section>

</main>

<footer>
    © 2026 SmartVendeur AI — Tous droits réservés.
  </footer>

</body>
</html>
